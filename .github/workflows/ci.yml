name: Check studio
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: studio_test
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: test-only
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U studio" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.lock
      - run: pytest backend/tests -q
      - run: pytest backend/tests -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://studio:test-only@localhost:5432/studio_test
      - run: npm ci && npm run build && npm run typecheck
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: uvicorn backend.main:app --host 127.0.0.1 --port 8000 > /tmp/studio-api.log 2>&1 &
      - run: npm test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: frontend/test-results
